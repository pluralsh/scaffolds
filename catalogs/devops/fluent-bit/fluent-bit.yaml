apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: fluent-bit
  namespace: apps
spec:
  template:
    name: fluent-bit
    namespace: fluent-bit
    helm:
      url: https://fluent.github.io/helm-charts
      chart: fluent-bit
      version: "0.58.2"
      values:
        kind: DaemonSet
        flush: 5
        metricsPort: 2020
        serviceMonitor:
          enabled: false
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
