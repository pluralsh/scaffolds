apiVersion: v1
kind: ServiceAccount
metadata:
  name: memos
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memos-policy
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
data:
  memos-instance-setting-general.json: |
    {
      "key": "GENERAL",
      "generalSetting": {
        "disallowUserRegistration": true,
        "disallowPasswordAuth": false
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: memos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memos
    spec:
      serviceAccountName: memos
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: memos
        image: neosmemo/memos:0.30.0@sha256:71a5b4738d1bed96e92112004054f0888e92791b64eb78afd79077c96e6f9327
        imagePullPolicy: IfNotPresent
        env:
        - name: MEMOS_ADDR
          value: "0.0.0.0"
        - name: MEMOS_PORT
          value: "5230"
        - name: MEMOS_DATA
          value: /var/opt/memos
        - name: MEMOS_DRIVER
          value: sqlite
        - name: MEMOS_DEMO
          value: "false"
        - name: MEMOS_INSTANCE_URL
          value: ""
        ports:
        - name: http
          containerPort: 5230
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/opt/memos
        - name: policy
          mountPath: /etc/secrets
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: memos-data
      - name: policy
        configMap:
          name: memos-policy
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memos
  namespace: memos
  labels:
    app.kubernetes.io/name: memos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memos
  ports:
  - name: http
    port: 5230
    targetPort: http
