apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: cloud-functions-{{ context.name }}
  namespace: apps
spec:
{% if context.ai %}
  agentId: {{ context.ai.session.agent_id }}
{% endif %}
  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/cloud-functions/{{ context.name }}
  repositoryRef:
    name: infra
    namespace: infra
  variables:
    name: "{{ context.name }}"
    region: "{{ context.region }}"
    cloud_connection: "{{ context.cloudConnection }}"
    artifact_version: "{{ context.version }}"
    {% if context.invokerServiceAccount %}
    invoker_service_account: "{{ context.invokerServiceAccount }}"
    {% endif %}
    {% if context.cloud == 'aws' %}
    functions:
      - volume-delete
      - vm-delete
      - node-pool-resize
    {% endif %}
    {% if context.cloud == 'gcp' %}
    functions:
      - volume-delete
      - vm-delete
    {% endif %}
    {% if context.cloud == 'azure' %}
    # Functions are deployed for the resource groups they may act on.
    functions:
      - volume-delete
      - lb-frontend-delete
      {% if context.clusterResourceGroup %}
      - node-pool-resize
      {% endif %}
      {% if context.vmResourceGroup %}
      - vm-delete
      {% endif %}
      {% if context.databaseResourceGroup %}
      - db-restore
      {% endif %}
      {% if context.sshResourceGroup %}
      - ssh-access
      {% endif %}
    scopes:
      volume-delete: ["{{ context.nodeResourceGroup }}"]
      lb-frontend-delete: ["{{ context.nodeResourceGroup }}"]
      {% if context.clusterResourceGroup %}
      node-pool-resize: ["{{ context.clusterResourceGroup }}"]
      {% endif %}
      {% if context.vmResourceGroup %}
      vm-delete: ["{{ context.vmResourceGroup }}"]
      {% endif %}
      {% if context.databaseResourceGroup %}
      db-restore: ["{{ context.databaseResourceGroup }}"]
      {% endif %}
      {% if context.sshResourceGroup %}
      ssh-access: ["{{ context.sshResourceGroup }}"]
      {% endif %}
    {% if context.networkResourceGroup %}
    network_scopes: ["{{ context.networkResourceGroup }}"]
    {% endif %}
    {% if context.sshBastionId %}
    ssh_bastion_id: "{{ context.sshBastionId }}"
    {% endif %}
    {% endif %}
  # Before terraform runs, the init container downloads this cloud's release packages into
  # /artifacts/<version> and verifies them against SHA256SUMS. With raw, the operator ignores the
  # other jobSpec fields, and a stack's jobSpec replaces the default one from the deployment
  # settings, so the stacks service account, which carries the cloud identity (Azure and GKE
  # workload identity), is also set in raw.
  jobSpec:
    namespace: plrl-deploy-operator
    raw:
      template:
        {% if context.cloud == 'azure' %}
        metadata:
          namespace: plrl-deploy-operator
          labels:
            azure.workload.identity/use: "true"
        {% endif %}
        spec:
          {% if context.cloud == 'azure' or context.cloud == 'gcp' %}
          serviceAccountName: stacks
          {% endif %}
          initContainers:
            - name: fetch-functions
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  base=https://github.com/pluralsh/scaffolds/releases/download/functions/{{ context.version }}
                  mkdir -p /artifacts/{{ context.version }} && cd /artifacts/{{ context.version }}
                  curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
                  grep -E -- '-{{ context.cloud }}\.(zip|tar\.gz)$' SHA256SUMS > packages.sums || { echo "no {{ context.cloud }} functions in {{ context.version }}"; exit 1; }
                  for zip in $(awk '{print $2}' packages.sums); do
                    curl -fsSL --retry 3 -o "$zip" "$base/$zip"
                  done
                  sha256sum -c packages.sums
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
          containers:
            - name: default
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
                  readOnly: true
          volumes:
            - name: artifacts
              emptyDir: {}
  clusterRef:
    name: mgmt
    namespace: infra
