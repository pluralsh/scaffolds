apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: cloud-functions-{{ context.name }}
  namespace: apps
spec:
{% if context.ai %}
  agentId: {{ context.ai.session.agent_id }}
{% endif %}
  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/cloud-functions/{{ context.name }}
  repositoryRef:
    name: infra
    namespace: infra
  variables:
    name: "{{ context.name }}"
    region: "{{ context.region }}"
    cloud_connection_id: "{{ context.cloudConnectionId }}"
    artifact_version: "{{ context.version }}"
    {% if context.invokerServiceAccount %}
    invoker_service_account: "{{ context.invokerServiceAccount }}"
    {% endif %}
  {% if context.cloud != 'gcp' %}
  # The init container downloads the release's function packages for this cloud, verified
  # against SHA256SUMS, into /artifacts/<version> before terraform runs. GCP pulls images
  # instead. With raw, the operator ignores the other jobSpec fields, so on Azure the workload
  # identity is set in raw as well.
  jobSpec:
    namespace: plrl-deploy-operator
    raw:
      template:
        {% if context.cloud == 'azure' %}
        metadata:
          namespace: plrl-deploy-operator
          labels:
            azure.workload.identity/use: "true"
        {% endif %}
        spec:
          {% if context.cloud == 'azure' %}
          serviceAccountName: stacks
          {% endif %}
          initContainers:
            - name: fetch-functions
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  base=https://github.com/pluralsh/scaffolds/releases/download/functions/{{ context.version }}
                  mkdir -p /artifacts/{{ context.version }} && cd /artifacts/{{ context.version }}
                  curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
                  grep -- '-{{ context.cloud }}.zip$' SHA256SUMS > packages.sums || { echo "no {{ context.cloud }} functions in {{ context.version }}"; exit 1; }
                  for zip in $(awk '{print $2}' packages.sums); do
                    curl -fsSL --retry 3 -o "$zip" "$base/$zip"
                  done
                  sha256sum -c packages.sums
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
          containers:
            - name: default
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
                  readOnly: true
          volumes:
            - name: artifacts
              emptyDir: {}
  {% endif %}
  clusterRef:
    name: mgmt
    namespace: infra
