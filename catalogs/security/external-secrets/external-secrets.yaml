apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: external-secrets
  namespace: apps
spec:
  template:
    name: external-secrets
    namespace: external-secrets
    helm:
      url: https://charts.external-secrets.io
      chart: external-secrets
      version: 'x.x.x'
      values:
        # Install CustomResourceDefinitions (ExternalSecret, SecretStore, ClusterSecretStore, etc.)
        installCRDs: true
        # Webhook validation service
        webhook:
          create: true
        # Certificate controller for webhook TLS certificates
        certController:
          create: true
