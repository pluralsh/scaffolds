apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: falco
spec:
  name: falco
  icon: https://raw.githubusercontent.com/cncf/artwork/master/projects/falco/icon/color/falco-icon-color.png
  identifier: mgmt
  documentation: |
    Sets up Falco runtime threat detection as a per-node DaemonSet with the
    modern eBPF driver and Kubernetes metadata enrichment.
  creates:
    git:
      ref: main
      folder: catalogs/security/falco
    templates:
    - source: README.md
      destination: documentation/falco/README.md
      external: true
    - source: falco.yaml
      destination: bootstrap/apps/falco/falco.yaml
      external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: security
  scmConnectionRef:
    name: plural # you'll need to add this ScmConnection manually before this is functional
  title: Falco setup
  message: |
    Sets up Falco runtime security monitoring in the management cluster using
    the official Falco Helm chart and the modern eBPF probe.

    Plural Service: mgmt/apps
  configuration: []
