apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: opentelemetry
spec:
  name: opentelemetry
  icon: https://ebpf.io/static/logo-black-98b7a1413b4a74ed961d292cf83da82e.svg
  identifier: mgmt
  documentation: |
    Sets up OpenTelemetry stack.
  creates:
    git:
      ref: main
      folder: catalogs/devops/opentelemetry
    templates:
      - source: OpenTelemetry-Tag-Setup-Guide.md
        destination: "documentation/opentelemetry/OpenTelemetry-Tag-Setup-Guide.md"
        external: true
      - source: opentelemetry-ebpf.yaml
        destination: "bootstrap/apps/opentelemetry/opentelemetry-ebpf.yaml"
        external: true
      - source: opentelemetry-collector.yaml
        destination: "bootstrap/apps/opentelemetry/opentelemetry-collector.yaml"
        external: true
      - source: helm
        destination: helm/opentelemetry
        external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: devops
  scmConnectionRef:
    name: plural # you'll need to add this ScmConnection manually before this is functional
  title: "OpenTelemetry stack setup"
  message: |
    Sets up OpenTelemetry stack that includes eBPF and collector components.
  configuration:
    - name: tags
      type: STRING
      optional: true
      documentation: "Optional comma-separated key=value tags applied to both GlobalServices, for example release=1.0,enabled=true,tier=01. Keys and values remain strings. Omit or leave empty to apply no tag filter."
