apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: keda
spec:
  name: keda
  icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/keda/icon/color/keda-icon-color.svg
  identifier: mgmt
  documentation: |
    Sets up KEDA event-driven autoscaling as a cluster-wide GlobalService.
  creates:
    git:
      ref: main
      folder: catalogs/devops/keda
    templates:
    - source: README.md
      destination: documentation/keda/README.md
      external: true
    - source: keda.yaml
      destination: bootstrap/apps/keda/keda.yaml
      external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: devops
  scmConnectionRef:
    name: plural # you'll need to add this ScmConnection manually before this is functional
  title: "Global KEDA Setup"
  message: |
    Sets up KEDA as a GlobalService Helm deployment.

    Plural Service: mgmt/apps
  configuration: []
