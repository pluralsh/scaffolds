apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: cert-manager
spec:
  name: cert-manager
  icon: https://cert-manager.io/images/cert-manager-logo-icon.svg
  identifier: mgmt
  documentation: Sets up cert manager for a kubernetes fleet in the given cloud
  creates:
    git:
      ref: main
      folder: catalogs/network/cert-manager
    templates:
    - source: helm/certmanager.yaml.liquid
      destination: helm/certmanager.yaml.liquid
      external: true
    - source: CertManager-DNS01-Guide.md
      destination: documentation/cert-manager/CertManager-Fleet-Setup.md
      external: true
    - source: globalservice.yaml
      destination: bootstrap/components/cert-manager.yaml
      external: true
    - source: issuers.yaml
      destination: bootstrap/components/cluster-issuers.yaml
      external: true
    - source: issuers
      destination: services/cert-manager/issuers
      external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: network
  scmConnectionRef:
    name: plural  # you'll need to add this ScmConnection manually before this is functional
  title: "Setting up cert manager on our fleet"
  message: |
    Set up cert manager for all workload clusters.  This also provisions a base dns01 issuer for reliable issuance relative
    to the http01 solver.
  configuration:
  - name: cloud
    type: ENUM
    documentation: Cloud provider to deploy cert-manager and its DNS-01 issuer to.
    values:
    - aws
    - azure
    - gcp
  - name: email
    type: STRING
    documentation: ACME account contact email to register with Let's Encrypt.
  - name: dnsZone
    type: STRING
    documentation: The DNS zone name to use for the cert manager issuer.
    condition:
      field: cloud
      operation: EQ
      value: 'azure'
  - name: resourceGroupName
    type: STRING
    documentation: The resource group name to use for the cert manager issuer.
    condition:
      field: cloud
      operation: EQ
      value: 'azure'

  - name: region
    type: STRING
    documentation: AWS region used by the Route53 DNS-01 solver.
    condition:
      field: cloud
      operation: EQ
      value: aws
