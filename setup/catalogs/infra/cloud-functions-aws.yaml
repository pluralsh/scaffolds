apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: cloud-functions-aws
spec:
  name: cloud-functions-aws
  icon: https://docs.plural.sh/favicon-128.png
  identifier: mgmt
  documentation: |
    Deploys the operational AWS functions (volume-delete, vm-delete and node-pool-resize)
    and registers them as Plural workbench tools.
  creates:
    git:
      ref: main
      folder: catalogs/infra/cloud-functions-aws
    templates:
      - source: stack.yaml
        destination: "bootstrap/apps/cloud-functions/{{ context.name }}/stack.yaml"
        external: true
      - source: terraform
        destination: terraform/apps/cloud-functions/{{ context.name }}
        external: true
      - source: README.md
        destination: documentation/cloud-functions-aws/README.md
        external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: infra
  scmConnectionRef:
    name: plural  # you'll need to add this ScmConnection manually before this is functional
  title: "Setting up AWS cloud functions {{ context.name }}"
  message: |
    Set up AWS cloud functions {{ context.name }} ({{ context.region }})

    Will deploy volume-delete, vm-delete and node-pool-resize from release {{ context.version }} and register each as a
    workbench tool. Every call of a function requires human approval.

    Plural Service: mgmt/apps
  confirmation:
    text: |
      The functions are invoked by workbenches through a cloud connection, which needs
      permission to invoke them. Every function is registered as a workbench tool, and every
      call of a function requires human approval.
    checklist:
      - label: "I will attach the invoke_policy_arn output to the IAM principal of the cloud connection."
      - label: "The cloud connection is in the same AWS region as the functions."
  configuration:
    - name: name
      type: STRING
      documentation: Name of this installation, used as a prefix for every function, role and workbench tool.
      validation:
        regex: "^[a-z][a-z0-9-]{0,39}$"
    - name: region
      type: STRING
      documentation: AWS region to deploy the functions to. It must match the region of the cloud connection.
    - name: cloudConnection
      type: STRING
      documentation: Name of the Plural cloud connection workbenches use to invoke the functions. It must be for AWS.
    - name: nodePoolMaxCount
      type: INT
      optional: true
      documentation: Largest desired size node-pool-resize may set. Defaults to 100; at most 1000.
    - name: allowSkipSnapshot
      type: BOOL
      optional: true
      documentation: Let volume-delete callers skip the snapshot it takes before deleting a volume. Off by default, so every deleted volume can be restored from its snapshot.
    - name: version
      type: STRING
      documentation: Functions release to deploy, e.g. v0.1.0 (the functions/<version> tag in pluralsh/scaffolds).
      validation:
        regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$"
