apiVersion: deployments.plural.sh/v1alpha1
kind: PrAutomation
metadata:
  name: cloud-functions
spec:
  name: cloud-functions
  icon: https://docs.plural.sh/favicon-128.png
  identifier: mgmt
  documentation: |
    Deploys operational cloud functions (orphaned resource cleanup, node group resizing, ...)
    and registers them as Plural workbench tools.
  creates:
    git:
      ref: main
      folder: catalogs/infra/cloud-functions
    templates:
      - source: stack.yaml
        destination: "bootstrap/apps/cloud-functions/{{ context.name }}/stack.yaml"
        external: true
      - source: "terraform/{{ context.cloud }}"
        destination: terraform/apps/cloud-functions/{{ context.name }}
        external: true
      - source: README.md
        destination: documentation/cloud-functions/README.md
        external: true
  repositoryRef:
    name: scaffolds
  catalogRef:
    name: infra
  scmConnectionRef:
    name: plural  # you'll need to add this ScmConnection manually before this is functional
  title: "Setting up cloud functions {{ context.name }} on {{ context.cloud }}"
  message: |
    Set up cloud functions {{ context.name }} ({{ context.cloud }}, {{ context.region }})

    Will deploy the operational cloud functions from release {{ context.version }} and register
    each as a workbench tool. Every call of a function that changes resources requires human
    approval.

    Plural Service: mgmt/apps
  confirmation:
    text: |
      The functions are invoked by workbenches through a cloud connection, which needs
      permission to invoke them. Every function is registered as a workbench tool, and every
      call of a function that changes resources requires human approval.
    checklist:
      - label: "I will grant the cloud connection the invoke permission from the stack outputs (AWS: attach invoke_policy_arn to its IAM principal; Azure: assign invoke_role_definition_id to its service principal on each of invoke_scopes; GCP: set the invoker service account or grant it roles/run.invoker)."
      - label: "The cloud connection is in the same AWS region, or Azure subscription, as the functions."
  configuration:
    - name: name
      type: STRING
      documentation: Name of this installation, used as a prefix for every function, role and workbench tool.
      validation:
        regex: "^[a-z][a-z0-9-]{0,39}$"
    - name: cloud
      type: ENUM
      documentation: Cloud provider to deploy the functions to.
      values:
        - aws
        - azure
        - gcp
    - name: region
      type: STRING
      documentation: Region (AWS, GCP) or location (Azure) to deploy the functions to. On AWS it must match the region of the cloud connection, on Azure it must support the Flex Consumption plan.
    - name: cloudConnection
      type: STRING
      documentation: Name of the Plural cloud connection workbenches use to invoke the functions. It must be for the selected cloud.
    - name: invokerServiceAccount
      type: STRING
      documentation: Email of the cloud connection service account. When set, it is granted roles/run.invoker on the functions registered as workbench tools.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'gcp'
    - name: nodeResourceGroup
      type: STRING
      documentation: Resource group ID of the AKS node resource group (/subscriptions/<id>/resourceGroups/MC_...). volume-delete and lb-frontend-delete are deployed and may only act on disks and load balancers there.
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: clusterResourceGroup
      type: STRING
      documentation: Resource group ID of AKS clusters whose node pools node-pool-resize may resize. Leave empty to not deploy node-pool-resize.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: networkResourceGroup
      type: STRING
      documentation: Resource group ID of the network the AKS clusters and databases use outside the resource groups above, such as a BYO or hub VNet, public IP prefixes or private DNS zones. node-pool-resize, lb-frontend-delete and db-restore only get the join actions there, which changing resources that reference them needs.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: vmResourceGroup
      type: STRING
      documentation: Resource group ID of standalone VMs vm-delete may delete. Leave empty to not deploy vm-delete.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: databaseResourceGroup
      type: STRING
      documentation: Resource group ID of PostgreSQL and MySQL flexible servers db-restore may restore (into new servers in the same resource group). Leave empty to not deploy db-restore.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: sshResourceGroup
      type: STRING
      documentation: Resource group ID of Linux VMs ssh-access may grant Entra ID login to. Leave empty to not deploy ssh-access.
      optional: true
      condition:
        field: cloud
        operation: EQ
        value: 'azure'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+$"
    - name: sshBastionId
      type: STRING
      documentation: Resource ID of the Azure Bastion host (Standard SKU or higher, native client support) users connect through; ssh-access returns the az network bastion ssh command for it. Leave empty for a direct az ssh vm command.
      optional: true
      condition:
        field: sshResourceGroup
        operation: PREFIX
        value: '/subscriptions/'
      validation:
        regex: "^/subscriptions/[0-9a-fA-F-]{36}/resourceGroups/[^/]+/providers/Microsoft\\.Network/bastionHosts/[^/]+$"
    - name: allowSkipSnapshot
      type: BOOL
      optional: true
      documentation: Let volume-delete callers skip the snapshot it takes before deleting a volume. Off by default, so every deleted volume can be restored from its snapshot.
    - name: nodePoolMaxCount
      type: INT
      optional: true
      documentation: Largest node count node-pool-resize may set (AWS, and Azure with clusterResourceGroup). Defaults to 100; at most 1000.
    - name: sshAccessMaxMinutes
      type: INT
      optional: true
      documentation: Longest access ssh-access may grant, in minutes. Defaults to 240; at most 1440 (a day).
      condition:
        field: sshResourceGroup
        operation: PREFIX
        value: '/subscriptions/'
    - name: version
      type: STRING
      documentation: Functions release to deploy, e.g. v0.1.0 (the functions/<version> tag in pluralsh/scaffolds).
      validation:
        regex: "^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$"
