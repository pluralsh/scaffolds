apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: mlflow-mlflow-aws-test
  namespace: apps
spec:

  namespace: mlflow
  git:
    folder: helm/mlflow/mlflow-aws-test
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "2.x.x"
    chart: mlflow
    release: mlflow
    ignoreHooks: false
    url: https://charts.bitnami.com/bitnami
    valuesFiles:
      - mlflow.yaml.liquid
  imports:
    - stackRef:
        name: mlflow-mlflow-aws-test
        namespace: apps
  configuration:
    cluster: mlflow-aws-test
    stackName: mlflow-mlflow-aws-test
    hostname: mlflow.example.org
    bucket: mlflow-artifacts-example-test
    region: us-east-2
  cluster: mlflow-aws-test
