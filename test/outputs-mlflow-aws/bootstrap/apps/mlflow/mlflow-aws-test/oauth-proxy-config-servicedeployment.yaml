apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: mlflow-oauth-proxy-config-mlflow-aws-test
  namespace: apps
spec:

  namespace: mlflow
  git:
    folder: helm/mlflow/mlflow-aws-test
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "x.x.x"
    chart: oidc-config
    url: https://pluralsh.github.io/module-library
    valuesFiles:
    - oauth-proxy-config.yaml.liquid
  imports:
  - stackRef:
      name: mlflow-mlflow-aws-test
      namespace: apps
  configuration:
    cluster: mlflow-aws-test
    hostname: mlflow.example.org
    stackName: mlflow-mlflow-aws-test
  cluster: mlflow-aws-test
