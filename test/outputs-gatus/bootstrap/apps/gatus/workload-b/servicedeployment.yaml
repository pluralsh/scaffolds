apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: gatus-workload-b
  namespace: apps
spec:

  name: gatus
  namespace: gatus
  git:
    ref: main
    folder: helm/gatus/workload-b
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    chart: gatus
    version: "1.5.0"
    release: gatus
    url: https://twin.github.io/helm-charts
    valuesFiles:
    - values.yaml
  cluster: "workload-b"
