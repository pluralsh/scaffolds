cluster: devbox-full-aws-karpenter
cloud: aws
region: us-east-2
pool: devbox
sandboxClass: microvm
awsProvisioner: karpenter
installKarpenter: false
maxCpu: "1000"
instanceTypes: c8id.4xlarge
diskMode: local
bootDiskSize: "250"
minNodes: "1"
maxNodes: "10"
diskPrepImage: ghcr.io/pluralsh/agent-harness-base:0.6.76
runnerName: platform
agent: claude
scmConnections: github, gitlab
allowedRepositories: https://github.com/acme/api.git,https://github.com/acme/web.git
autonomy: manual
browser: true
awsRoleArn: arn:aws:iam::123456789012:role/devbox
instanceCpu: "2"
instanceMemory: 4Gi
instanceDisk: 20Gi
workerCpu: "14"
workerMemory: 56Gi
diskSize: "880"
spareInstances: "2"
substrate: true
substrateVersion: "0.1.0"
