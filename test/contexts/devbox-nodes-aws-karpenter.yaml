cluster: devbox-aws-karpenter
cloud: aws
region: us-east-2
pool: devbox
sandboxClass: microvm
awsProvisioner: karpenter
installKarpenter: true
karpenterVersion: "1.13.0"
maxCpu: "1000"
instanceTypes: c8id.4xlarge, m8id.4xlarge
diskMode: local
bootDiskSize: "100"
minNodes: "1"
maxNodes: "10"
diskPrepImage: ghcr.io/pluralsh/agent-harness-base:0.6.76
