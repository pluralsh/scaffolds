apiVersion: deployments.plural.sh/v1alpha1
kind: GeneratedSecret
metadata:
  name: qdrant-api-key-{{ context.cluster }}
  namespace: infra
spec:
  template:
    api_key: {% raw %}"{{ 48 | randAlphaNum }}"{% endraw %}
  destinations:
  - name: qdrant-api-key-{{ context.cluster }}
    namespace: infra
  - name: qdrant-api-key-{{ context.cluster }}
    namespace: plrl-deploy-operator
