apiVersion: deployments.plural.sh/v1alpha1
kind: GeneratedSecret
metadata:
  name: nats-users-{{ context.cluster }}
  namespace: infra
spec:
  template:
    username: "nats"
    password: {% raw %}"nats_{{ 48 | randAlphaNum }}"{% endraw %}
  destinations:
  - name: nats-users-{{ context.cluster }}
    namespace: infra
  - name: nats-users-{{ context.cluster }}
    namespace: plrl-deploy-operator
