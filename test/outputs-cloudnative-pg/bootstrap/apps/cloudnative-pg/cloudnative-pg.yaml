apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: cloudnative-pg
  namespace: infra
spec:
  tags:
    role: workload
  template:
    name: cloudnative-pg
    namespace: cnpg-system
    helm:
      chart: cloudnative-pg
      url: https://cloudnative-pg.github.io/charts
      version: 0.29.0
      values:
        replicaCount: 1
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
