apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: trust-manager-mgmt
  namespace: apps
spec:

  namespace: trust-manager
  git:
    folder: helm/trust-manager/mgmt
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "v0.25.0"
    chart: trust-manager
    release: trust-manager
    url: https://charts.jetstack.io
    valuesFiles:
    - trust-manager.yaml.liquid
  cluster: "mgmt"
