apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: n8n-n8n-azure-test
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/n8n/n8n-azure-test
  repositoryRef:
    name: infra
    namespace: infra

  jobSpec:
    namespace: plrl-deploy-operator
    labels:
      azure.workload.identity/use: "true"
    serviceAccount: "stacks"

  clusterRef:
    name: mgmt
    namespace: infra
