apiVersion: v1
kind: ServiceAccount
metadata:
  name: tika
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: tika
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tika
  ports:
  - name: http
    port: 9998
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tika
    spec:
      serviceAccountName: tika
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 35002
        runAsGroup: 35002
        fsGroup: 35002
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tika
        image: apache/tika:4.0.0@sha256:a8b442501f601fb15015de974f9afe13dd242b0f14e49a2b144fadcb214a555b
        args: ["-c", "/etc/tika/tika-config.json"]
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-Xms64m -Xmx256m -Djava.io.tmpdir=/tmp -Duser.home=/tmp"
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        ports:
        - name: http
          containerPort: 9998
        startupProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /version
            port: http
          periodSeconds: 30
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 128Mi
          limits:
            cpu: "4"
            memory: 2Gi
            ephemeral-storage: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/tika
          readOnly: true
        - name: temporary
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: tika-config
      - name: temporary
        emptyDir:
          sizeLimit: 512Mi
