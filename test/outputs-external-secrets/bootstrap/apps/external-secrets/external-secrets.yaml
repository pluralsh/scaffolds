apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: external-secrets
  namespace: apps
spec:
  template:
    name: external-secrets
    namespace: external-secrets
    helm:
      url: https://charts.external-secrets.io
      chart: external-secrets
      version: 2.10.0
      values:
        installCRDs: true
        certController:
          enabled: true
          requeueInterval: 10m
        webhook:
          enabled: true
        bitwarden-sdk-server:
          enabled: false
        securityContext:
          runAsNonRoot: true
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
