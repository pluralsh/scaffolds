apiVersion: platform.plural.sh/v1alpha1
kind: PrContracts
metadata:
  name: workspaces
spec:
  workdir: test/outputs
  templates:
    from: catalogs/data/airbyte
    to: test/outputs/catalogs/data/airbyte
  automations:
  - file: ../../setup/catalogs/data/airbyte.yaml
    context: ../contexts/airbyte.yaml
  - file: ../../setup/catalogs/infra/cloud-functions-aws.yaml
    context: ../contexts/cloud-functions-aws.yaml
    externalDir: ../../catalogs/infra/cloud-functions-aws
  - file: ../../setup/catalogs/infra/cloud-functions-azure.yaml
    context: ../contexts/cloud-functions-azure.yaml
    externalDir: ../../catalogs/infra/cloud-functions-azure
  - file: ../../setup/catalogs/infra/cloud-functions-gcp.yaml
    context: ../contexts/cloud-functions-gcp.yaml
    externalDir: ../../catalogs/infra/cloud-functions-gcp
  - file: ../../setup/catalogs/infra/cloud-functions-azure.yaml
    context: ../contexts/cloud-functions-azure-all.yaml
    externalDir: ../../catalogs/infra/cloud-functions-azure
  - file: ../../setup/catalogs/devops/plural-telemetry.yaml
    context: ../contexts/plural-telemetry-aws.yaml
    externalDir: ../../catalogs/devops/plural-telemetry
  - file: ../../setup/catalogs/devops/plural-telemetry.yaml
    context: ../contexts/plural-telemetry-azure.yaml
    externalDir: ../../catalogs/devops/plural-telemetry
  - file: ../../setup/catalogs/devops/plural-telemetry.yaml
    context: ../contexts/plural-telemetry-gcp.yaml
    externalDir: ../../catalogs/devops/plural-telemetry
  - file: ../../setup/catalogs/devops/plural-telemetry-agent.yaml
    context: ../contexts/plural-telemetry-agent.yaml
    externalDir: ../../catalogs/devops/plural-telemetry-agent
