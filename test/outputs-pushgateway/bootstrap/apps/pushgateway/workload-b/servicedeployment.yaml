apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: pushgateway-workload-b
  namespace: apps
spec:

  agentId: test-agent-pushgateway

  name: pushgateway
  namespace: pushgateway
  git:
    ref: main
    folder: helm/pushgateway/workload-b
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    chart: prometheus-pushgateway
    version: "3.8.0"
    release: pushgateway
    url: https://prometheus-community.github.io/helm-charts
    valuesFiles:
    - values.yaml
  cluster: "workload-b"
