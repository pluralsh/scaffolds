apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: loki
  namespace: apps
spec:
  template:
    name: loki
    namespace: loki
    helm:
      url: https://grafana.github.io/helm-charts
      chart: loki
      version: "7.3.0"
      values:
        deploymentMode: SingleBinary
        loki:
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
            - from: "2024-01-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
        singleBinary:
          replicas: 1
          persistence:
            enabled: true
            size: 10Gi
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        lokiCanary:
          enabled: false
        test:
          enabled: false
        gateway:
          service:
            type: ClusterIP
