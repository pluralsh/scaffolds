apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: memos-mgmt
  namespace: apps
spec:

  name: memos
  namespace: memos
  git:
    ref: main
    folder: kubernetes/memos/mgmt
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  cluster: "mgmt"
