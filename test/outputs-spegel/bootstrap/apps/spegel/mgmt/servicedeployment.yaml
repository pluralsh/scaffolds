apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: spegel-mgmt
  namespace: apps
spec:

  name: spegel
  namespace: spegel
  git:
    folder: helm/spegel/mgmt
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    url: oci://ghcr.io/spegel-org/helm-charts
    chart: spegel
    version: "0.7.4"
    release: spegel
    valuesFiles:
    - spegel.yaml.liquid
  cluster: mgmt
