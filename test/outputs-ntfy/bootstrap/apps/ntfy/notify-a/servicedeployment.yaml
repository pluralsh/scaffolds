apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: ntfy-notify-a
  namespace: apps
spec:

  name: ntfy
  namespace: ntfy
  git:
    ref: main
    folder: helm/ntfy/notify-a
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    chart: ntfy
    version: "1.2.2"
    release: ntfy
    url: https://repo.helmforge.dev
    valuesFiles:
    - values.yaml
  cluster: "notify-a"
