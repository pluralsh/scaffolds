apiVersion: deployments.plural.sh/v1alpha1
kind: DeploymentSettings
metadata:
  name: global
  namespace: plrl-deploy-operator
spec:
  logging:
    driver: LOKI
    elastic:
      host: https://es.example.com
      index: plrl-logs-*
      passwordSecretRef:
        key: password
        name: plrl-elastic-user
      user: plrl
    enabled: true
    loki:
      host: https://telemetry.plural.sh/logs/read/ns/default
      passwordSecretRef:
        key: password
        name: telemetry-auth-gcp
      user: plrl
  managementRepo: pluralsh/example
  prometheusConnection:
    host: https://telemetry.plural.sh/metrics/read/ns/default
    passwordSecretRef:
      key: password
      name: telemetry-auth-gcp
    user: plrl
