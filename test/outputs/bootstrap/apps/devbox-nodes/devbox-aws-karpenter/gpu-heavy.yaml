








apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: devbox-nodes-devbox-aws-karpenter-gpu-heavy
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/devbox-nodes/devbox-aws-karpenter/gpu-heavy
  repositoryRef:
    name: infra
    namespace: infra
  
  clusterRef:
    name: mgmt
    namespace: infra


---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: devbox-nodes-devbox-aws-karpenter-gpu-heavy
  namespace: apps
spec:

  name: devbox-nodes-gpu-heavy
  # Shared by every devbox pool on the cluster; each pool's resources carry its name.
  namespace: devbox-nodes
  git:
    folder: services/devbox-nodes/devbox-aws-karpenter/gpu-heavy
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra

  imports:
  - stackRef:
      name: devbox-nodes-devbox-aws-karpenter-gpu-heavy
      namespace: apps
  configuration:
    stackName: devbox-nodes-devbox-aws-karpenter-gpu-heavy
    pool: gpu-heavy
    diskModel: "Instance Storage"
    diskPrepImage: ghcr.io/pluralsh/agent-harness-base:0.6.76
  cluster: devbox-aws-karpenter
