apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: telemetry-azure-dev
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/telemetry/azure-dev
  repositoryRef:
    name: infra
    namespace: infra
  
  jobSpec:
    namespace: plrl-deploy-operator
    labels:
      azure.workload.identity/use: "true"
    serviceAccount: stacks
  
  clusterRef:
    name: mgmt
    namespace: infra
---
# Basic auth password shared by all three products. It is generated by the
# Console controller on mgmt, so it is never committed to git or stored in
# terraform state. The stack service reads it through configurationRef and the
# chart creates the secret on the target cluster, which may not be mgmt.
apiVersion: deployments.plural.sh/v1alpha1
kind: GeneratedSecret
metadata:
  name: telemetry-auth-azure-dev
  namespace: apps
spec:
  template:
    username: plrl
    password: "{{ 32 | randAlphaNum }}"
  destinations:
  - name: telemetry-auth-azure-dev
    namespace: apps
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-operator-azure-dev
  namespace: apps
spec:

  name: telemetry-operator
  namespace: plrl-telemetry
  helm:
    version: "0.1.42"
    chart: telemetry-operator
    release: telemetry-operator
    url: oci://ghcr.io/pluralsh/charts
  cluster: azure-dev
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-stack-azure-dev
  namespace: apps
spec:

  name: telemetry-stack
  namespace: plrl-telemetry
  git:
    folder: helm/telemetry/azure-dev
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "0.1.25"
    chart: telemetry-stack
    release: telemetry-stack
    url: oci://ghcr.io/pluralsh/charts
    valuesFiles:
    - telemetry.yaml.liquid
  dependencies:
  - name: telemetry-operator
  configurationRef:
    name: telemetry-auth-azure-dev
    namespace: apps
  imports:
  - stackRef:
      name: telemetry-azure-dev
      namespace: apps
  configuration:
    cluster: "azure-dev"
    cloud: "azure"
    stackName: telemetry-azure-dev
    hostname: "telemetry.plural.sh"
    ingressClass: "nginx"
    clusterIssuer: "letsencrypt-prod"
  cluster: azure-dev

---
# Grafana Alloy on every cluster, including mgmt, shipping metrics, logs and
# traces to the Telemetry ingress above. It reuses the generated credentials
# through configurationRef, so no password is stored in git.
apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: telemetry-alloy-operator
  namespace: apps
spec:
  mgmt: true
  cascade:
    detach: true
  template:
    name: telemetry-alloy-operator
    namespace: plrl-telemetry-agent
    dependencies: []
    helm:
      version: "0.8.0"
      chart: alloy-operator
      url: https://grafana.github.io/helm-charts
      values:
        crds:
          deployAlloyCRD: true
---
apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: telemetry-alloy
  namespace: apps
spec:
  mgmt: true
  template:
    name: telemetry-alloy
    namespace: plrl-telemetry-agent
    dependencies:
    - name: telemetry-alloy-operator
    git:
      ref: main
      folder: helm/telemetry/azure-dev
    repositoryRef:
      kind: GitRepository
      name: infra
      namespace: infra
    configurationRef:
      name: telemetry-auth-azure-dev
      namespace: apps
    helm:
      version: "4.5.3"
      chart: k8s-monitoring
      url: https://grafana.github.io/helm-charts
      valuesFiles:
      - alloy.yaml.liquid

