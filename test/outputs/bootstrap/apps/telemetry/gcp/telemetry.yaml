apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: telemetry-gcp
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/telemetry/gcp
  repositoryRef:
    name: infra
    namespace: infra
  
  clusterRef:
    name: mgmt
    namespace: infra
---
# Basic auth password shared by all three products. It is generated by the
# Console controller on mgmt, so it is never committed to git or stored in
# terraform state. The stack service reads it through configurationRef and the
# chart creates the secret on the target cluster, which may not be mgmt.
apiVersion: deployments.plural.sh/v1alpha1
kind: GeneratedSecret
metadata:
  name: telemetry-auth-gcp
  namespace: apps
spec:
  template:
    username: plrl
    password: "{{ 32 | randAlphaNum }}"
  destinations:
  - name: telemetry-auth-gcp
    namespace: apps
  # The Console reads this one: the global DeploymentSettings resolve secret
  # references in their own namespace, plrl-deploy-operator. The name is per
  # instance so it cannot collide with a secret another GeneratedSecret owns.
  - name: telemetry-auth-gcp
    namespace: plrl-deploy-operator
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-operator-gcp
  namespace: apps
spec:

  name: telemetry-operator
  namespace: plrl-telemetry
  helm:
    version: "0.1.42"
    chart: telemetry-operator
    release: telemetry-operator
    url: oci://ghcr.io/pluralsh/charts
  cluster: gcp
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-stack-gcp
  namespace: apps
spec:

  name: telemetry-stack
  namespace: plrl-telemetry
  git:
    folder: helm/telemetry/gcp
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "0.1.25"
    chart: telemetry-stack
    release: telemetry-stack
    url: oci://ghcr.io/pluralsh/charts
    valuesFiles:
    - telemetry.yaml.liquid
  dependencies:
  - name: telemetry-operator
  configurationRef:
    name: telemetry-auth-gcp
    namespace: apps
  imports:
  - stackRef:
      name: telemetry-gcp
      namespace: apps
  configuration:
    cluster: "gcp"
    cloud: "gcp"
    stackName: telemetry-gcp
    hostname: "telemetry.plural.sh"
    ingressClass: "nginx"
    clusterIssuer: "letsencrypt-prod"
  cluster: gcp

