apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: telemetry-mgmt
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/telemetry/mgmt
  repositoryRef:
    name: infra
    namespace: infra
  
  clusterRef:
    name: mgmt
    namespace: infra
---
# Basic auth password shared by all three products. It is generated by the
# Console controller on mgmt, so it is never committed to git or stored in
# terraform state. The stack service reads it through configurationRef and the
# chart creates the secret on the target cluster, which may not be mgmt.
apiVersion: deployments.plural.sh/v1alpha1
kind: GeneratedSecret
metadata:
  name: telemetry-auth-mgmt
  namespace: apps
spec:
  template:
    username: plrl
    password: "{{ 32 | randAlphaNum }}"
  destinations:
  - name: telemetry-auth-mgmt
    namespace: apps
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-operator-mgmt
  namespace: apps
spec:

  name: telemetry-operator
  namespace: plrl-telemetry
  helm:
    version: "0.1.42"
    chart: telemetry-operator
    release: telemetry-operator
    url: oci://ghcr.io/pluralsh/charts
  cluster: mgmt
---
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-stack-mgmt
  namespace: apps
spec:

  name: telemetry-stack
  namespace: plrl-telemetry
  git:
    folder: helm/telemetry/mgmt
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  helm:
    version: "0.1.25"
    chart: telemetry-stack
    release: telemetry-stack
    url: oci://ghcr.io/pluralsh/charts
    valuesFiles:
    - telemetry.yaml.liquid
  dependencies:
  - name: telemetry-operator
  configurationRef:
    name: telemetry-auth-mgmt
    namespace: apps
  imports:
  - stackRef:
      name: telemetry-mgmt
      namespace: apps
  configuration:
    cluster: "mgmt"
    cloud: "aws"
    stackName: telemetry-mgmt
    hostname: "telemetry.plural.sh"
    ingressClass: "nginx"
    clusterIssuer: "letsencrypt-prod"
  cluster: mgmt

---
# Needs the Prometheus operator CRDs (monitoring.coreos.com/v1) on the target
# cluster, and something that scrapes ServiceMonitors.
apiVersion: deployments.plural.sh/v1alpha1
kind: ServiceDeployment
metadata:
  name: telemetry-monitoring-mgmt
  namespace: apps
spec:

  name: telemetry-monitoring
  namespace: plrl-telemetry
  git:
    folder: monitoring/telemetry/mgmt
    ref: main
  repositoryRef:
    kind: GitRepository
    name: infra
    namespace: infra
  dependencies:
  - name: telemetry-stack
  cluster: mgmt

