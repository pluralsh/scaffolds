apiVersion: deployments.plural.sh/v1alpha1
kind: InfrastructureStack
metadata:
  name: cloud-functions-ops-az-all
  namespace: apps
spec:

  detach: false
  type: TERRAFORM
  approval: true
  manageState: true
  actor: console@plural.sh
  git:
    ref: main
    folder: terraform/apps/cloud-functions/ops-az-all
  repositoryRef:
    name: infra
    namespace: infra
  variables:
    name: "ops-az-all"
    region: "eastus"
    cloud_connection: "azure-workbench"
    artifact_version: "v0.1.0-spike.1"
    
    allow_skip_snapshot: true
    
    functions:
      - volume-delete
      - lb-frontend-delete
      - node-pool-resize
      - vm-delete
      - db-restore
      - ssh-access
    # Each function only gets permissions on the resource groups terraform derives from these
    # (scopes in terraform overrides them per function).
    cluster_resource_group: "mgmt"
    
    vm_resource_group: "vms"
    
    
    database_resource_group: "databases"
    
    
    network_resource_groups: ["network"]
    
    
    ssh_bastion_id: "/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/hub/providers/Microsoft.Network/bastionHosts/hub-bastion"
    
    
    resource_group_name: "functions"
    
    
    invoker_principal_id: "11111111-2222-3333-4444-555555555555"
    
    
    node_pool_max_count: 20
    
    
    ssh_access_max_minutes: 120
    
  # Before terraform runs, the init container downloads the release's Azure packages into
  # /artifacts/<version> and verifies them against SHA256SUMS. With raw, the operator ignores the
  # other jobSpec fields, and a stack's jobSpec replaces the default one from the deployment
  # settings, so the service account the stack identity trusts is also set in raw.
  #
  # The pod mounts the service account token terraform exchanges for the stack identity's Azure
  # token itself, instead of the Azure workload identity webhook, which only AKS mgmt clusters
  # run; the provider gets the identity's client ID from plrl/azure/identity.
  jobSpec:
    namespace: plrl-deploy-operator
    raw:
      template:
        metadata:
          namespace: plrl-deploy-operator
        spec:
          serviceAccountName: azure-stacks
          initContainers:
            - name: fetch-functions
              image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  base=https://github.com/pluralsh/scaffolds/releases/download/functions/v0.1.0-spike.1
                  mkdir -p /artifacts/v0.1.0-spike.1 && cd /artifacts/v0.1.0-spike.1
                  curl -fsSL --retry 3 -o SHA256SUMS "$base/SHA256SUMS"
                  grep -E -- '-azure\.(zip|tar\.gz)$' SHA256SUMS > packages.sums || { echo "no azure functions in v0.1.0-spike.1"; exit 1; }
                  for zip in $(awk '{print $2}' packages.sums); do
                    curl -fsSL --retry 3 -o "$zip" "$base/$zip"
                  done
                  sha256sum -c packages.sums
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
          containers:
            - name: default
              volumeMounts:
                - name: artifacts
                  mountPath: /artifacts
                  readOnly: true
                - name: azure-identity-token
                  mountPath: /var/run/secrets/azure/tokens
                  readOnly: true
          volumes:
            - name: artifacts
              emptyDir: {}
            - name: azure-identity-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: api://AzureADTokenExchange
                      expirationSeconds: 3600
                      path: azure-identity-token
  clusterRef:
    name: mgmt
    namespace: infra
