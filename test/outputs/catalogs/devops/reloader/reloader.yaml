apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: reloader
  namespace: apps
spec:
  template:
    name: reloader
    namespace: reloader-system
    helm:
      url: https://stakater.github.io/stakater-charts
      chart: reloader
      version: '2.2.17'
      values:
        reloader:
          autoReloadAll: false
          watchGlobally: true
          reloadOnCreate: false
          reloadOnDelete: false
          reloadStrategy: annotations
