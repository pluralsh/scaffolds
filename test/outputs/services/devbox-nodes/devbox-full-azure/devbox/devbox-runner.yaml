









apiVersion: deployments.plural.sh/v1alpha1
kind: DevboxRunner
metadata:
  name: platform
spec:

  agents:
  - type: claude
    default: true






  - type: codex




  - type: opencode




  - type: gemini




  - type: pi




  autonomy:
    default: auto
    max: full

  # each devbox's /home/dev is its own cloud disk from agent-substrate's block driver, in one zone
  home:
    storage: Block

  cloudIdentities:
  - name: azure
    default: true
    azure:
      tenantId: 00000000-0000-0000-0000-000000000001
      clientId: 00000000-0000-0000-0000-000000000002

  resources:
    cpu: "2"
    memory: 4Gi
    disk: 20Gi
  workerPool:
    autoscaling:
      minReplicas: 1
      maxReplicas: 10
      spareInstances: 1

    diskSize: 2560Gi

    sandboxClass: gvisor
    nodeSelector:
      plural.sh/devbox-pool: devbox
    tolerations:
    # Lets the cluster autoscaler size the pool from its template; atelet still waits for the disk.
    - key: plural.sh/devbox-disk
      operator: Exists
      effect: NoSchedule





    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"

    resources:
      requests: {cpu: "14", memory: 112Gi}
      limits: {cpu: "14", memory: 112Gi}
