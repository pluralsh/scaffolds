









apiVersion: deployments.plural.sh/v1alpha1
kind: DevboxRunner
metadata:
  name: platform
spec:

  agents:
  - type: claude
    default: true






  - type: codex




  - type: opencode




  - type: gemini




  - type: pi



  scmConnections:

  - github

  - gitlab



  allowedRepositories:

  - https://github.com/acme/api.git

  - https://github.com/acme/web.git


  autonomy:
    default: manual
    max: full

  browser:
    enabled: true

  home:
    storage: ZeroFS

  cloudIdentities:
  - name: aws
    default: true
    aws:
      roleArn: arn:aws:iam::123456789012:role/devbox

  resources:
    cpu: "2"
    memory: 4Gi
    disk: 20Gi
  workerPool:
    autoscaling:
      minReplicas: 1
      maxReplicas: 10
      spareInstances: 2

    diskSize: 880Gi

    sandboxClass: microvm
    nodeSelector:
      plural.sh/devbox-pool: devbox
    tolerations:
    # Lets the cluster autoscaler size the pool from its template; atelet still waits for the disk.
    - key: plural.sh/devbox-disk
      operator: Exists
      effect: NoSchedule

    podAnnotations:
      karpenter.sh/do-not-disrupt: "true"

    resources:
      requests: {cpu: "14", memory: 56Gi}
      limits: {cpu: "14", memory: 56Gi}
