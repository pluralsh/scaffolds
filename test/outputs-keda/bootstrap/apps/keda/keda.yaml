apiVersion: deployments.plural.sh/v1alpha1
kind: GlobalService
metadata:
  name: keda
  namespace: apps
spec:
  template:
    name: keda
    namespace: keda
    helm:
      url: https://kedacore.github.io/charts
      chart: keda
      version: "2.20.2"
      values:
        crds:
          install: true
        operator:
          replicaCount: 2
        metricsServer:
          enabled: true
          replicaCount: 2
        webhooks:
          enabled: true
          replicaCount: 2
        securityContext:
          operator:
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          metricServer:
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          webhooks:
            capabilities:
              drop:
              - ALL
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
        podSecurityContext:
          operator:
            runAsNonRoot: true
          metricServer:
            runAsNonRoot: true
          webhooks:
            runAsNonRoot: true
