name: Functions Release

# Push a functions/vX.Y.Z tag to publish function zips and SHA256SUMS as a GitHub release.
# Tags with a suffix (functions/vX.Y.Z-rc.1) are published as pre-releases.
# A manual run builds the artifacts without publishing anything.
#
# TODO(PROD-5251): also upload the AWS zips to the Plural-hosted public S3 bucket of every
# supported region (s3://<bucket>-<region>/functions/<version>/<binary>.zip), using AWS
# credentials obtained through GitHub OIDC. Terraform reads them via artifact_s3_bucket.
on:
  push:
    tags:
    - functions/v*
  workflow_dispatch: {}

concurrency:
  group: functions-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/functions-build.yaml
    permissions:
      contents: read

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/functions/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: functions-dist
          path: dist

      - name: verify checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi

          {
            echo "Operational cloud functions ${TAG#functions/}."
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md

          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            $prerelease

  # Publishes one Cloud Run image per GCP function to the public Plural Artifact Registry as
  # <GCP_FUNCTIONS_REPOSITORY>/<bin>:<version>. Skipped until the repository variables exist.
  # TODO(PROD-5251): create the public Artifact Registry repository (allUsers reader) and the
  # workload identity pool for this repo, then set the GCP_FUNCTIONS_REPOSITORY,
  # GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT repository variables.
  images:
    name: publish gcp images
    needs: build
    if: startsWith(github.ref, 'refs/tags/functions/v') && vars.GCP_FUNCTIONS_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: functions
    env:
      REPOSITORY: ${{ vars.GCP_FUNCTIONS_REPOSITORY }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        name: checkout repo

      - uses: ./.github/actions/functions-toolchain

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: build and push images
        run: |
          gcloud auth configure-docker "${REPOSITORY%%/*}" --quiet
          just images "$REPOSITORY" "${TAG#functions/}"
          just push-images "$REPOSITORY" "${TAG#functions/}"
