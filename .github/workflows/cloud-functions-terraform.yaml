name: Cloud Functions Terraform

on:
  pull_request:
    branches:
    - main
    paths:
    - catalogs/infra/cloud-functions/terraform/**
    - functions/bins/**
    - .github/workflows/cloud-functions-terraform.yaml

jobs:
  validate:
    name: validate ${{ matrix.cloud }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cloud:
        - aws
        - azure
        - gcp
    defaults:
      run:
        working-directory: catalogs/infra/cloud-functions/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v7
        name: checkout repo
        with:
          persist-credentials: false

      # The minimum required_version of the modules, so features newer than it are caught too.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      # The functions deploy the release packages named after these binaries, and the package
      # format follows the bin's cloud suffix, so a typo or rename would only fail at deploy time.
      - name: check function binaries
        env:
          CLOUD: ${{ matrix.cloud }}
        run: |
          bins=$(sed -n 's/^ *binary *= *"\(.*\)"$/\1/p' locals.tf)
          if [[ -z "$bins" ]]; then echo "::error::no binary found in locals.tf"; exit 1; fi
          status=0
          for bin in $bins; do
            if [[ "$bin" != *-"$CLOUD" ]]; then
              echo "::error::$bin does not end with -$CLOUD"; status=1
            elif [[ ! -d "$GITHUB_WORKSPACE/functions/bins/$bin" ]]; then
              echo "::error::$bin is not in functions/bins"; status=1
            fi
          done
          exit $status
