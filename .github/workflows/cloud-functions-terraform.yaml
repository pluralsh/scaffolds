name: Cloud Functions Terraform

on:
  pull_request:
    branches:
    - main
    paths:
    - catalogs/infra/cloud-functions/terraform/**
    - functions/bins/**
    - functions/go/gcp/**
    - .github/workflows/cloud-functions-terraform.yaml

# A new push to a PR supersedes its running validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ${{ matrix.cloud }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cloud:
        - aws
        - azure
        - gcp
    defaults:
      run:
        working-directory: catalogs/infra/cloud-functions/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v7
        name: checkout repo
        with:
          persist-credentials: false

      # The minimum required_version of the modules, so features newer than it are caught too.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      # AWS and Azure deploy the release packages named after their Rust binaries, whose package
      # format follows the bin's cloud suffix. GCP deploys the Go source and calls the entry point
      # registered with the Functions Framework. A typo or rename would only fail at deploy time.
      - name: check function sources
        env:
          CLOUD: ${{ matrix.cloud }}
        run: |
          status=0
          if [[ "$CLOUD" == gcp ]]; then
            names=$(sed -n 's/^ *entry_point *= *"\(.*\)"$/\1/p' locals.tf)
            if [[ -z "$names" ]]; then echo "::error::no entry_point found in locals.tf"; exit 1; fi
            for name in $names; do
              if ! grep -qF "functions.HTTP(\"$name\"" "$GITHUB_WORKSPACE"/functions/go/gcp/*.go; then
                echo "::error::$name is not registered in functions/go/gcp"; status=1
              fi
            done
          else
            bins=$(sed -n 's/^ *binary *= *"\(.*\)"$/\1/p' locals.tf)
            if [[ -z "$bins" ]]; then echo "::error::no binary found in locals.tf"; exit 1; fi
            for bin in $bins; do
              if [[ "$bin" != *-"$CLOUD" ]]; then
                echo "::error::$bin does not end with -$CLOUD"; status=1
              elif [[ ! -d "$GITHUB_WORKSPACE/functions/bins/$bin" ]]; then
                echo "::error::$bin is not in functions/bins"; status=1
              fi
            done
          fi
          exit $status
