name: Cloud Functions Terraform

on:
  pull_request:
    branches:
    - main
    paths:
    - catalogs/infra/cloud-functions/terraform/**
    - functions/bins/**
    - functions/go/gcp/functions.go
    - .github/workflows/cloud-functions-terraform.yaml

# A new push to a PR supersedes its running validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate ${{ matrix.cloud }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cloud:
        - aws
        - azure
        - gcp
    defaults:
      run:
        working-directory: catalogs/infra/cloud-functions/terraform/${{ matrix.cloud }}
    steps:
      - uses: actions/checkout@v7
        name: checkout repo
        with:
          persist-credentials: false

      # The minimum required_version of the modules, so features newer than it are caught too.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - run: terraform fmt -check -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate

      # AWS and Azure deploy the release packages named after their Rust binaries, whose package
      # format follows the bin's cloud suffix. A typo or rename would only fail at deploy time.
      - name: check function binaries
        if: matrix.cloud != 'gcp'
        env:
          CLOUD: ${{ matrix.cloud }}
        run: |
          bins=$(sed -n 's/^ *binary *= *"\(.*\)"$/\1/p' locals.tf)
          if [[ -z "$bins" ]]; then echo "::error::no binary found in locals.tf"; exit 1; fi
          for bin in $bins; do
            if [[ "$bin" != *-"$CLOUD" ]]; then
              echo "::error::$bin does not end with -$CLOUD"; status=1
            elif [[ ! -d "$GITHUB_WORKSPACE/functions/bins/$bin" ]]; then
              echo "::error::$bin is not in functions/bins"; status=1
            fi
          done
          exit $status

      # GCP functions are entry points of the shared Go source package instead, registered with
      # functions.HTTP in functions/go/gcp/functions.go.
      - name: check function entry points
        if: matrix.cloud == 'gcp'
        run: |
          entry_points=$(sed -n 's/^ *entry_point *= *"\(.*\)"$/\1/p' locals.tf)
          if [[ -z "$entry_points" ]]; then echo "::error::no entry_point found in locals.tf"; exit 1; fi
          status=0
          for entry_point in $entry_points; do
            if ! grep -q "functions.HTTP(\"$entry_point\"" "$GITHUB_WORKSPACE/functions/go/gcp/functions.go"; then
              echo "::error::$entry_point is not registered in functions/go/gcp/functions.go"; status=1
            fi
          done
          exit $status
