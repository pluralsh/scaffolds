name: Functions CI

# Pushes to main also build, so the Rust cache that PRs and releases restore is kept warm.
on:
  pull_request:
    branches:
    - main
    paths:
    - functions/**
    - .github/workflows/functions-*.yaml
  push:
    branches:
    - main
    paths:
    - functions/**
    - .github/workflows/functions-*.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new push to a PR supersedes its running build. Builds on main always finish, as they save
  # the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: ./.github/workflows/functions-build.yaml
    permissions:
      contents: read
