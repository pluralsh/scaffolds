name: Functions Build

# Shared by functions-ci and functions-release so both build exactly the same artifacts.
on:
  workflow_call: {}

jobs:
  build:
    name: check and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        name: checkout repo

      - uses: ./.github/actions/functions-toolchain

      - run: just check
      - run: just package

      - uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: functions/dist/
          if-no-files-found: error
          retention-days: 7
