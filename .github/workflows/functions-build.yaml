name: Functions Build

# Shared by functions-ci and functions-release so both build exactly the same artifacts.
# The checks and the packaging run in parallel; callers that need the artifact wait for both.
on:
  workflow_call: {}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
        name: checkout repo
        with:
          persist-credentials: false

      # Installs the toolchain, components and targets pinned in functions/rust-toolchain.toml
      # and caches the builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: functions
          cache-workspaces: functions
          # Only main saves the cache: tag builds can restore main's cache but not a PR's, and
          # PR caches would evict it.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Its default, deny, fails the release builds on linker warnings; clippy in
          # `just check` denies warnings already.
          build-warnings: warn

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      - run: just check

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
        name: checkout repo
        with:
          persist-credentials: false

      # Installs the toolchain, components and targets pinned in functions/rust-toolchain.toml
      # and caches the builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          rust-src-dir: functions
          cache-workspaces: functions
          # Only main saves the cache: tag builds can restore main's cache but not a PR's, and
          # PR caches would evict it.
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          # Its default, deny, fails the release builds on linker warnings; clippy in
          # `just check` denies warnings already.
          build-warnings: warn

      - uses: extractions/setup-just@v4
        with:
          just-version: 1.58.0

      # The PyPI package is the documented CI install and pulls in Zig for cross-compilation.
      # Zig is pinned too, as cargo-lambda only sets a lower bound on it.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: install cargo-lambda
        run: pip install cargo-lambda==1.9.2 ziglang==0.16.0

      - run: just package

      - uses: actions/upload-artifact@v7
        with:
          name: functions-dist
          path: functions/dist/
          if-no-files-found: error
          retention-days: 7
