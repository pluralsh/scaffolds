name: Functions Build

# Shared by functions-ci and functions-release so both build exactly the same artifacts.
on:
  workflow_call: {}

jobs:
  build:
    name: check and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
        name: checkout repo

      # Installs the toolchain, components and targets pinned in functions/rust-toolchain.toml
      # and caches the builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: functions
          cache-workspaces: functions
          # Its default, -D warnings, fails the release builds on linker warnings; clippy in
          # `just check` denies warnings already.
          rustflags: ""

      - uses: extractions/setup-just@v2

      # The PyPI package is the documented CI install and pulls in Zig for cross-compilation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install cargo-lambda
        run: pip install cargo-lambda==1.9.2

      - run: just check
      - run: just package

      - uses: actions/upload-artifact@v4
        with:
          name: functions-dist
          path: functions/dist/
          if-no-files-found: error
          retention-days: 7
