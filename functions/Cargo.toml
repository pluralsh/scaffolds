[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pluralsh/scaffolds"
publish = false

[workspace.dependencies]
functions-core = { path = "crates/core" }
functions-aws = { path = "crates/aws" }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-sts = "1"
aws-smithy-types = "1"
lambda_runtime = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
