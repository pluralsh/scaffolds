[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches rust-toolchain.toml. Cargo only picks dependency versions that support this version,
# so an older value holds dependencies back.
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pluralsh/scaffolds"
publish = false

[workspace.dependencies]
functions-core = { path = "crates/core" }
functions-aws = { path = "crates/aws" }
functions-azure = { path = "crates/azure" }
functions-http = { path = "crates/http" }

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-eks = "1"
aws-sdk-autoscaling = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-smithy-mocks = "0.3"
aws-smithy-types = "1"
async-trait = "0.1"
axum = "0.8"
azure_core = "1"
azure_identity = "1"
lambda_runtime = "1"
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
webpki-root-certs = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
